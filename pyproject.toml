[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopsweep"
version = "0.1.0"
description = "Architecture-agnostic agent that finds security issues, slop, coding gaps and loose ends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
agent = ["anthropic>=1.6"]

[project.scripts]
slopsweep = "slopsweep.cli:main"

[tool.setuptools]
packages = ["slopsweep"]
